<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Network Monitor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 2rem; color: #6366f1; }
        .logo p { color: #64748b; font-size: 0.9rem; margin-top: 5px; }
        .card {
            background: #1e293b;
            border: 1px solid #2d3f55;
            border-radius: 12px;
            padding: 30px;
        }
        .alert-error {
            background: rgba(239,68,68,0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }
        .alert-success {
            background: rgba(34,197,94,0.1);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            color: #64748b;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid #2d3f55;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #6366f1; }
        .btn {
            width: 100%;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn:hover { background: #4f46e5; }
        .roles {
            margin-top: 20px;
            padding: 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid #2d3f55;
            border-radius: 8px;
        }
        .roles h4 {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .role-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            margin-bottom: 6px;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .admin { background: rgba(99,102,241,0.2); color: #a5b4fc; }
        .viewer { background: rgba(34,197,94,0.15); color: #86efac; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>&#128269; NetMonitor</h1>
        <p>Sistema de Monitoreo de Red</p>
    </div>

    <div class="card">
        <div th:if="${param.error}" class="alert-error">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert-success">
            Sesión cerrada correctamente.
        </div>
        <div th:if="${param.expired}" class="alert-error">
            Tu sesión ha expirado. Inicia sesión de nuevo.
        </div>

        <form action="/do-login" method="post">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username"
                       class="form-input" placeholder="Ingresa tu usuario"
                       required autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       class="form-input" placeholder="Ingresa tu contraseña"
                       required/>
            </div>
            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>

        <div class="roles">
            <h4>Niveles de acceso</h4>
            <div class="role-item">
                <span class="badge admin">ADMIN</span>
                <span>Ver, agregar, editar y eliminar hosts</span>
            </div>
            <div class="role-item">
                <span class="badge viewer">VIEWER</span>
                <span>Solo lectura del dashboard</span>
            </div>
        </div>
    </div>
    <div class="footer">SMRED v1.0 | Tecnologico de Antioquia | 2026</div>
</div>
</body>
</html>
