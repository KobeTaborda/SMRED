# ==========================================
# CONFIGURACION DE BASE DE DATOS SQL SERVER
# ==========================================
# Opcion A: Autenticacion SQL Server (usuario y contrasena)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=network_monitor;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=TdeA.2025
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Opcion B: Windows Authentication (sin contrasena)
# Comenta las 3 lineas de Opcion A y descomenta estas:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=network_monitor;integratedSecurity=true;encrypt=false;trustServerCertificate=true
# spring.datasource.username=
# spring.datasource.password=

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVIDOR
# ==========================================
server.port=8080
spring.application.name=NetworkMonitor

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ==========================================
# EMAIL (para alertas) - Configurar con tu correo
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO@gmail.com
spring.mail.password=TU_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# MONITOREO - Intervalos en milisegundos
# ==========================================
monitor.ping.interval=30000
monitor.portscan.interval=300000
monitor.bandwidth.interval=10000
monitor.alert.latency-threshold=500
monitor.alert.packet-loss-threshold=20
monitor.alert.email-enabled=false
monitor.alert.email-to=admin@empresa.com

# ==========================================
# LOGGING
# ==========================================
logging.level.com.networkmonitor=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
