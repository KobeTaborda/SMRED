<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ancho de Banda - Network Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-logo"><i class="fas fa-network-wired"></i><span>NetMonitor</span></div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/}"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a th:href="@{/hosts}"><i class="fas fa-server"></i> Hosts</a></li>
        <li><a th:href="@{/alerts}"><i class="fas fa-bell"></i> Alertas</a></li>
        <li class="active"><a th:href="@{/bandwidth}"><i class="fas fa-chart-area"></i> Ancho de Banda</a></li>
    </ul>
</nav>
<main class="main-content">
    <header class="page-header">
        <h1><i class="fas fa-chart-area"></i> Monitoreo de Ancho de Banda</h1>
        <div class="header-actions">
            <select id="ifaceSelector" class="select-input" onchange="loadBandwidth()">
                <option value="">-- Seleccionar Interfaz --</option>
                <option th:each="iface : ${interfaces}" th:value="${iface}" th:text="${iface}"></option>
            </select>
            <select id="hoursSelector" class="select-input" onchange="loadBandwidth()">
                <option value="1">Última hora</option>
                <option value="6">Últimas 6 horas</option>
                <option value="24" selected>Últimas 24 horas</option>
            </select>
        </div>
    </header>

    <!-- Tarjetas en tiempo real -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon blue"><i class="fas fa-arrow-down"></i></div>
            <div class="stat-info">
                <span class="stat-label">Recepción (RX)</span>
                <span class="stat-value" id="rxRate">-- Kbps</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-arrow-up"></i></div>
            <div class="stat-info">
                <span class="stat-label">Transmisión (TX)</span>
                <span class="stat-value" id="txRate">-- Kbps</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange"><i class="fas fa-exchange-alt"></i></div>
            <div class="stat-info">
                <span class="stat-label">Total (RX+TX)</span>
                <span class="stat-value" id="totalRate">-- Kbps</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon purple"><i class="fas fa-network-wired"></i></div>
            <div class="stat-info">
                <span class="stat-label">Interfaces Activas</span>
                <span class="stat-value" th:text="${#lists.size(interfaces)}">0</span>
            </div>
        </div>
    </div>

    <section class="card mt-20">
        <div class="card-header">
            <h2><i class="fas fa-chart-area"></i> Tasa de Transferencia</h2>
        </div>
        <div class="card-body chart-container-wide">
            <canvas id="bandwidthChart"></canvas>
        </div>
    </section>
</main>

<script>
let bwChart = null;

async function loadBandwidth() {
    const iface = document.getElementById('ifaceSelector').value;
    const hours = document.getElementById('hoursSelector').value;
    if (!iface) return;

    const resp = await fetch(`/api/bandwidth?iface=${iface}&hours=${hours}`);
    const data = await resp.json();

    const labels = data.map(r => {
        const d = new Date(r.recordedAt);
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    });
    const rxData = data.map(r => r.rxRateKbps || 0);
    const txData = data.map(r => r.txRateKbps || 0);

    const ctx = document.getElementById('bandwidthChart').getContext('2d');
    if (bwChart) bwChart.destroy();

    bwChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [
                {
                    label: 'RX (Kbps)',
                    data: rxData,
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99,102,241,0.15)',
                    fill: true, tension: 0.4, pointRadius: 1
                },
                {
                    label: 'TX (Kbps)',
                    data: txData,
                    borderColor: '#22c55e',
                    backgroundColor: 'rgba(34,197,94,0.10)',
                    fill: true, tension: 0.4, pointRadius: 1
                }
            ]
        },
        options: {
            responsive: true,
            animation: false,
            scales: {
                y: { beginAtZero: true, title: { display: true, text: 'Kbps' } },
                x: { ticks: { maxTicksLimit: 24 } }
            }
        }
    });

    // Actualizar tarjetas de resumen
    const latest = data[data.length - 1];
    if (latest) {
        const rx = (latest.rxRateKbps || 0).toFixed(1);
        const tx = (latest.txRateKbps || 0).toFixed(1);
        document.getElementById('rxRate').textContent = rx + ' Kbps';
        document.getElementById('txRate').textContent = tx + ' Kbps';
        document.getElementById('totalRate').textContent = (parseFloat(rx)+parseFloat(tx)).toFixed(1) + ' Kbps';
    }
}

// Actualizar cada 10 segundos
setInterval(loadBandwidth, 10000);
</script>
</body>
</html>
