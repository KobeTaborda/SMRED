# SQL Server para desarrollo local.
# Uso:  docker compose up -d      (la primera vez tarda en descargar la imagen, ~1.5 GB)
name: smred

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smred-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Define DB_SA_PASSWORD en el archivo .env}
      # Tope de memoria para SQL Server (2 GB es el mínimo que acepta)
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    # No arranca solo al abrir Docker: se levanta únicamente con scripts/iniciar.ps1 o docker compose up
    restart: "no"

  # Tarea de una sola vez: crea la base de datos y un usuario propio para la app (la app nunca usa "sa")
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${DB_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-smred}
      DB_APP_USER: ${DB_APP_USER:-smred_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Define DB_APP_PASSWORD en el archivo .env}
    volumes:
      - ./docker/sqlserver/init.sql:/init.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -b -i /init.sql
        -v DB_NAME="$$DB_NAME" DB_APP_USER="$$DB_APP_USER" DB_APP_PASSWORD="$$DB_APP_PASSWORD"
        && echo "Base de datos lista."
    restart: "no"

volumes:
  sqlserver-data:
